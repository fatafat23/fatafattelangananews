<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporter Verification - Fatafat Telangana News</title>
<meta name="robots" content="noindex, follow">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:Arial,Helvetica,sans-serif;background:#f1f5f9;color:#0f172a;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
  .wrap{width:100%;max-width:440px;}
  .brand{text-align:center;margin-bottom:18px;}
  .brand .bn{font-size:19px;font-weight:bold;color:#0a1f44;letter-spacing:.5px;}
  .brand .bs{font-size:11px;color:#7c89a3;letter-spacing:3px;margin-top:3px;}
  .card{background:#fff;border-radius:16px;padding:26px 24px;box-shadow:0 12px 32px rgba(2,6,23,.08);}
  .head{text-align:center;border-bottom:2px solid #e2e8f2;padding-bottom:16px;margin-bottom:18px;}
  .head h1{font-size:15px;color:#0a1f44;letter-spacing:2px;text-transform:uppercase;}
  .badge{display:inline-block;margin-top:10px;padding:5px 14px;border-radius:999px;color:#fff;font-size:12px;font-weight:bold;letter-spacing:2px;}
  .badge.ok{background:#16a34a;}
  .badge.no{background:#dc2626;}
  .name{text-align:center;margin:16px 0 2px;font-size:23px;font-weight:bold;color:#0a1f44;}
  .post{text-align:center;font-size:14px;color:#d42027;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase;}
  .rows{margin-top:20px;}
  .row{display:flex;justify-content:space-between;padding:11px 2px;border-bottom:1px solid #eef2f7;font-size:14px;}
  .row:last-child{border-bottom:none;}
  .row .k{color:#7c89a3;}
  .row .v{font-weight:bold;color:#0f172a;text-align:right;}
  .foot{margin-top:20px;text-align:center;font-size:12.5px;color:#64748b;line-height:1.7;}
  .foot b{color:#0a1f44;}
  .notfound{text-align:center;padding:8px 4px;}
  .notfound h2{color:#dc2626;font-size:18px;margin-bottom:10px;}
  .notfound p{color:#64748b;font-size:14px;line-height:1.7;}
</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1619744726885376" crossorigin="anonymous"></script>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="bn">FATAFAT TELANGANA NEWS</div>
    <div class="bs">DIGITAL MEDIA &middot; sabse tez</div>
  </div>
  <div class="card">
    <div class="head">
      <h1>Reporter Verification</h1>
      <div id="badgeBox"></div>
    </div>
    <div id="result"></div>
    <div class="foot">
      Card ko misuse na karein. Agar galat/lost mile toh report karein:<br>
      <b>fatafattelangananews@gmail.com</b><br>
      www.fatafattelangananews.online &middot; Fatafat Telangana News
    </div>
  </div>
</div>

<script src="assets/js/reporters-data.js?v=20261015"></script>
 <script src="assets/js/site-data.js?v=20261007"></script>
<script>
  (function () {
    var qs = new URLSearchParams(window.location.search);
    var eid = (qs.get("eid") || "").trim();
    var v = (qs.get("v") || "").trim();
    var people = (window.FT_SITE_DATA && window.FT_SITE_DATA.people) || (window.FT_REPORTERS && window.FT_REPORTERS.people) || [];
    var rep = people.filter(function (p) { return (p.id || "").toLowerCase() === eid.toLowerCase(); })[0];
    var badge = document.getElementById("badgeBox");
    var result = document.getElementById("result");
    function rows(arr) {
      var h = "";
      arr.forEach(function (r) {
        h += '<div class="row"><span class="k">' + r[0] + '</span><span class="v">' + r[1] + '</span></div>';
      });
      return '<div class="rows">' + h + '</div>';
    }
    if (rep) {
      badge.innerHTML = rep.active
        ? '<div class="badge ok">&#10003; ACTIVE</div>'
        : '<div class="badge no">INACTIVE</div>';
      result.innerHTML =
        '<div class="name">' + (rep.name || "-") + '</div>' +
        '<div class="post">' + (rep.designation || "Reporter").toUpperCase() + '</div>' +
        rows([
          ["Emp ID", rep.id || "-"],
          ["Mobile", rep.mobile || "-"],
          ["State", rep.state || "-"],
          ["District", rep.district || "-"],
          ["Valid Upto", v ? v.split("-").reverse().join("-") : "-"]
        ]);
    } else {
      badge.innerHTML = "";
      result.innerHTML =
        '<div class="notfound"><h2>Card verify nahi ho payi</h2>' +
        '<p>Ye Emp ID valid nahi hai ya reporter list update nahi hui hai.<br>Contact: fatafattelangananews@gmail.com</p></div>';
    }
  })();
</script>
</body>
</html>
